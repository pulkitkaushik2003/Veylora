# =====================================
# Application
# =====================================
server.port=${APP_PORT}
 
spring.config.import=optional:file:./.env[.properties],optional:file:./veylora/.env[.properties]
 
# =====================================
# PostgreSQL Database
# =====================================
# PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
 
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
 
# =====================================
# JPA / Hibernate
# =====================================
# update is fine for development. Before production use Flyway/Liquibase and 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
 
# =====================================
# Security / API defaults
# =====================================
# Session cookie hardening (the app uses session cookies, not JWT)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=120m
# Production only (needs HTTPS). Leave commented while testing over http://:
# server.servlet.session.cookie.secure=true


spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000


 
# =====================================
# Exotel (optional server-wide default account; users can save their own in Settings)
# =====================================
# Put these in .env, they are read as plain environment-style keys:
#   EXOTEL_SID, EXOTEL_API_KEY, EXOTEL_API_TOKEN, EXOTEL_SUBDOMAIN (api.in.exotel.com or api.exotel.com),
#   EXOTEL_CALLER_ID, EXOTEL_SMS_FROM, EXOTEL_DLT_ENTITY_ID, EXOTEL_DEFAULT_APP_ID
# Users' own tokens are encrypted with MAIL_ENCRYPTION_KEY (same key as the mailbox passwords).

# =====================================
# Error Handling
# =====================================
server.error.include-message=never
server.error.include-binding-errors=never
 
# =====================================
# Logging
# =====================================
logging.level.com.example.veylora=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
 
# =====================================
# File uploads
# =====================================
app.audio.storage-dir=${AUDIO_STORAGE_DIR:uploads/audio}
# Zip of personal documents (up to ~100 MB) and audio uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB
 
# =====================================
# Actuator
# =====================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized